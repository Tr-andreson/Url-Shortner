apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: production
  name: golang-backend-prod-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: golang-backend-prod
  minReplicas: 3          
  maxReplicas: 10         
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  
